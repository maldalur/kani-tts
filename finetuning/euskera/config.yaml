# Kani TTS Finetuning Configuration for Basque (Euskera)

# Model Configuration
model:
  base_model_name: "nineninesix/kani-tts-400m-0.3-pt"
  codec_model_name: "nvidia/nemo-nano-codec-22khz-0.6kbps-12.5fps"

# Dataset Configuration
dataset:
  dataset_path: "data/euskera"
  audio_dir: "data/euskera/audio"
  transcripts_file: "data/euskera/metadata.csv"
  sample_rate: 22050
  max_audio_duration: 30.0  # seconds

# Output Configuration
output:
  output_dir: "models/kani-tts-euskera"
  checkpoint_dir: "checkpoints/euskera"
  log_dir: "logs/euskera"

# Training Hyperparameters
training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  warmup_steps: 500
  weight_decay: 0.01
  max_seq_length: 1024
  
  # Optimization
  fp16: true
  gradient_checkpointing: true
  
  # Logging and Saving
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  
  # Evaluation
  evaluation_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"

# Tokenizer Settings
tokenizer:
  tokenizer_length: 64400
  start_of_text: 1
  start_of_audio: 64000
  end_of_audio: 64399
  audio_token_range: [64001, 64399]

# Data Split
data_split:
  test_size: 0.1
  random_seed: 42
